name: Bug report
description: Something does not work as documented
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool you called, the arguments, and what came back. Paste the JSON response if you have it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A spec file or config snippet helps the most.
  - type: input
    id: version
    attributes:
      label: cypress-mcp version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: cypress
    attributes:
      label: Cypress and @cypress/grep versions
      placeholder: "cypress 16.2.0, @cypress/grep 7.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code, Cursor, Windsurf, ..."
  - type: textarea
    id: doctor
    attributes:
      label: cypress_doctor output
      description: Run the cypress_doctor tool and paste the result.
      render: json
