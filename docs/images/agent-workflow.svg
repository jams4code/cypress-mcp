<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How an agent uses cypress-mcp</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="409" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="30" y="60" width="200" height="52" rx="10" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
    <text x="130" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">cypress_list_specs</text>
    <rect x="300" y="60" width="180" height="52" rx="10" fill="#16213e" stroke="#4f8cff" stroke-width="2"/>
    <text x="390" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">cypress_run</text>
    <rect x="730" y="204" width="200" height="52" rx="10" fill="#e94560" stroke="#be123c" stroke-width="2"/>
    <text x="830" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">cypress_get_failure</text>
    <text x="830" y="245" text-anchor="middle" font-size="11" fill="#ffe4e6" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">excerpt, diff, page, screenshot</text>
    <rect x="30" y="204" width="200" height="52" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="130" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">cypress_doctor</text>
  </g>
  <rect x="760" y="60" width="170" height="52" rx="10" fill="#2d6a4f" stroke="#40916c" stroke-width="2"/>
  <text x="845" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Done</text>
  <polygon points="600,40 670,86 600,132 530,86" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="600" y="91" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">tests fail?</text>
  <polygon points="600,184 670,230 600,276 530,230" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="600" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">enough</text>
  <text x="600" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">to fix?</text>
  <rect x="490" y="330" width="220" height="52" rx="10" fill="#0f3460" stroke="#8b5cf6" stroke-width="2"/>
  <text x="600" y="361" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Fix the app or the test</text>

  <line x1="232" y1="86" x2="296" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="482" y1="86" x2="526" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="672" y1="86" x2="756" y2="86" stroke="#40916c" stroke-width="2" marker-end="url(#a)"/>
  <text x="714" y="76" text-anchor="middle" font-size="12" fill="#334155">no, none flaky</text>
  <line x1="600" y1="134" x2="600" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="612" y="162" font-size="12" fill="#334155">yes</text>
  <line x1="672" y1="230" x2="726" y2="230" stroke="#e94560" stroke-width="2" marker-end="url(#a)"/>
  <text x="699" y="221" text-anchor="middle" font-size="12" fill="#334155">no</text>
  <line x1="600" y1="278" x2="600" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="612" y="306" font-size="12" fill="#334155">yes</text>
  <path d="M830,258 L830,356 L714,356" fill="none" stroke="#e94560" stroke-width="2" marker-end="url(#a)"/>
  <path d="M488,356 L390,356 L390,116" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a)"/>
  <text x="398" y="300" font-size="12" fill="#334155">rerun the test:</text>
  <text x="398" y="316" font-size="12" fill="#334155">path:line, repeat</text>
  <path d="M330,114 L330,230 L234,230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="282" y="221" text-anchor="middle" font-size="12" fill="#334155">cannot start</text>
</svg>
